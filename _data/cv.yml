- title: Research Interests
  type: list
  contents:
    - My research sits at the interface of biology, artificial intelligence, and statistical modeling to tackle fundamental questions in immunology. I develop data-driven approaches to predict T- and B-cell receptor–antigen interactions. Previously, I developed computational tools to model protein evolution and protein–protein interactions.

